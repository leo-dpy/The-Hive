<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Paramètres - The Hive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
</head>

<body>
    <div class="layout">
        <!-- Sidebar Gauche -->
        <div class="sidebar-left">
            <div class="logo">The <span>Hive.</span></div>
            <nav class="nav-menu">
                <a href="/home.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Accueil
                </a>
                <a href="/explore.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    Explorer
                </a>
                <a href="#" id="my-profile-link" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Profil
                </a>
                <a href="/messages.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Messages
                </a>
                <a href="/settings.html" class="nav-item active">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    Paramètres
                </a>
            </nav>
            <button class="btn-post" onclick="window.location.href='/home.html'">Publier</button>
        </div>

        <!-- Colonne Centrale -->
        <div class="feed-container">
            <div class="feed-header">Paramètres du Compte</div>

            <div class="form-container">
                <p id="msg" style="text-align:center; min-height:20px; margin-bottom:15px; font-weight:600;"></p>

                <div class="form-group" style="text-align: center; margin-bottom: 30px;">
                    <img id="current-avatar" src="/uploads/avatars/default.png"
                        style="width: 100px; height: 100px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; border: 2px solid var(--accent-gold);">
                    <br>
                    <label for="avatar-upload"
                        style="cursor:pointer; color: var(--accent-gold); font-size: 14px; font-weight: 600;">Changer la
                        photo de profil</label>
                    <input type="file" id="avatar-upload" accept="image/png, image/jpeg, image/gif"
                        style="display:none;">
                </div>

                <form id="settings-form">
                    <div class="form-group">
                        <label>Pseudo (@nom)</label>
                        <input type="text" id="username" placeholder="Votre pseudo">
                    </div>
                    <div class="form-group">
                        <label>Adresse E-mail</label>
                        <input type="email" id="email" placeholder="Votre adresse email">
                    </div>
                    <div class="form-group">
                        <label>Biographie</label>
                        <textarea id="bio" placeholder="Parlez-nous un peu de vous... (Visible sur votre profil)"
                            style="min-height: 100px;"></textarea>
                    </div>
                    <div class="form-group">
                        <label>Nouveau mot de passe</label>
                        <input type="password" id="new_password" placeholder="Laisser vide pour ne pas modifier">
                    </div>

                    <button type="submit" class="btn-large">Enregistrer les modifications</button>
                </form>

                <div style="margin-top: 40px; border-top: 1px solid var(--border-color); padding-top: 20px;">
                    <button id="logout-btn"
                        style="background: none; border: none; color: #e74c3c; font-weight: 600; cursor: pointer; font-size: 1rem;">Se
                        déconnecter</button>
                </div>
            </div>
        </div>

        <!-- Sidebar Droite -->
        <div class="sidebar-right">
            <div class="widget">
                <h3>Le saviez-vous ?</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; line-height:1.5;">
                    Vos informations sont sécurisées grâce à un hashage asymétrique Bcrypt. Personne, pas même les
                    administrateurs de la Ruche, ne peut connaître votre mot de passe.
                </p>
            </div>
        </div>
    </div>
    <script src="/js/settings.js"></script>
    <script src="/js/sidebar.js"></script>
</body>

</html>
