<!DOCTYPE html>
<html lang="fr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/svg+xml" href="/favicon.svg">
    <title>Profil - The Hive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .profile-header {
            padding: 30px 20px;
            border-bottom: 1px solid var(--border-color);
            text-align: center;
        }

        .profile-avatar {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            object-fit: cover;
            border: 3px solid var(--accent-gold);
            margin-bottom: 15px;
        }

        .profile-username {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 10px;
        }

        .profile-bio {
            font-size: 1rem;
            color: var(--text-color);
            margin-bottom: 20px;
            max-width: 400px;
            margin-left: auto;
            margin-right: auto;
            line-height: 1.5;
        }

        .profile-stats {
            display: flex;
            justify-content: center;
            gap: 30px;
            margin-bottom: 20px;
        }

        .stat-box {
            text-align: center;
        }

        .stat-val {
            font-size: 1.2rem;
            font-weight: 800;
        }

        .stat-label {
            font-size: 0.9rem;
            color: var(--text-muted);
        }

        .tabs {
            display: flex;
            border-bottom: 1px solid var(--border-color);
        }

        .tab {
            flex: 1;
            text-align: center;
            padding: 15px;
            font-weight: 600;
            cursor: pointer;
            color: var(--text-muted);
            transition: all 0.2s;
        }

        .tab.active {
            color: var(--accent-gold);
            border-bottom: 3px solid var(--accent-gold);
        }

        .tab:hover {
            background-color: var(--hover-bg);
        }
    </style>
</head>

<body>
    <div class="layout">
        <!-- Sidebar Gauche -->
        <div class="sidebar-left">
            <div class="logo">The <span>Hive.</span></div>
            <nav class="nav-menu">
                <a href="/home.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                        <polyline points="9 22 9 12 15 12 15 22"></polyline>
                    </svg>
                    Accueil
                </a>
                <a href="/explore.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    Explorer
                </a>
                <a href="#" id="my-profile-link" class="nav-item active">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
                        <circle cx="12" cy="7" r="4"></circle>
                    </svg>
                    Profil
                </a>
                <a href="/messages.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
                    </svg>
                    Messages
                </a>
                <a href="/settings.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                        style="margin-right:15px;">
                        <circle cx="12" cy="12" r="3"></circle>
                        <path
                            d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z">
                        </path>
                    </svg>
                    Paramètres
                </a>
            </nav>
            <button class="btn-post" onclick="window.location.href='/home.html'">Publier</button>
        </div>

        <!-- Colonne Centrale -->
        <div class="feed-container">
            <div class="feed-header" id="header-username">Chargement...</div>

            <div class="profile-header" id="profile-container" style="display: none;">
                <img id="p-avatar" src="/uploads/avatars/default.png" class="profile-avatar">
                <div class="profile-username" id="p-username"></div>
                <div class="profile-bio" id="p-bio"></div>

                <div class="profile-stats">
                    <div class="stat-box">
                        <div class="stat-val" id="p-followers">0</div>
                        <div class="stat-label">Abonnés</div>
                    </div>
                    <div class="stat-box">
                        <div class="stat-val" id="p-following">0</div>
                        <div class="stat-label">Abonnements</div>
                    </div>
                </div>

                <button class="btn-small" id="follow-btn"
                    style="width: 200px; padding: 12px; display: none; margin: 0 auto;"></button>
            </div>

            <div class="tabs" style="display:none;" id="tabs-container">
                <div class="tab active" id="tab-posts">Posts</div>
                <div class="tab" id="tab-likes">J'aime</div>
            </div>

            <div id="timeline">
                <p style="text-align:center; color:#888; margin-top:40px;" id="loading-msg">Chargement des données...
                </p>
            </div>
        </div>

        <!-- Sidebar Droite -->
        <div class="sidebar-right">
            <div class="widget">
                <h3>The Hive.</h3>
                <p style="color: var(--text-muted); font-size: 0.9rem; line-height:1.5;">
                    Le réseau social de la ruche. Partagez, aimez, commentez.
                </p>
            </div>
        </div>
    </div>
    <script src="/js/auth-modal.js"></script>
    <script src="/js/profile.js"></script>
    <script src="/js/sidebar.js"></script>
</body>

</html>
