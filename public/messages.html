<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Messages - The Hive</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/css/style.css">
    <style>
        .layout-messages {
            display: grid;
            grid-template-columns: 280px 1fr;
            gap: 30px;
            max-width: 1600px;
            width: 100%;
            height: 100vh;
            padding: 20px;
            margin: 0 auto;
            box-sizing: border-box;
        }
        
        .messages-container {
            display: flex;
            background: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            height: calc(100vh - 40px);
        }

        /* Left Pane */
        .contacts-pane {
            width: 350px;
            border-right: 1px solid var(--border-color);
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }
        .contacts-header {
            padding: 20px;
            font-size: 1.2rem;
            font-weight: 800;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .contacts-list {
            flex: 1;
            overflow-y: auto;
        }
        .contact-item {
            padding: 15px 20px;
            display: flex;
            align-items: center;
            gap: 15px;
            cursor: pointer;
            transition: background 0.2s;
            border-bottom: 1px solid var(--border-color);
        }
        .contact-item:hover, .contact-item.active {
            background: var(--hover-bg);
        }
        .contact-avatar {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
        }
        .contact-info {
            flex: 1;
            overflow: hidden;
        }
        .contact-name {
            font-weight: 600;
            margin-bottom: 5px;
        }
        .contact-preview {
            font-size: 0.9rem;
            color: var(--text-muted);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* Right Pane */
        .chat-pane {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-color);
        }
        .chat-empty {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .chat-header {
            padding: 20px;
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            font-weight: 600;
        }
        .chat-history {
            flex: 1;
            padding: 20px;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 15px;
        }
        .bubble {
            max-width: 60%;
            padding: 12px 18px;
            border-radius: 20px;
            font-size: 0.95rem;
            line-height: 1.4;
        }
        .bubble-sent {
            align-self: flex-end;
            background: var(--accent-gold);
            color: white;
            border-bottom-right-radius: 4px;
        }
        .bubble-received {
            align-self: flex-start;
            background: var(--hover-bg);
            border: 1px solid var(--border-color);
            border-bottom-left-radius: 4px;
        }
        .chat-input-area {
            padding: 20px;
            border-top: 1px solid var(--border-color);
            display: flex;
            gap: 10px;
        }
        .chat-input {
            flex: 1;
            padding: 15px;
            border-radius: 30px;
            border: 1px solid var(--border-color);
            background: transparent;
            color: var(--text-color);
            outline: none;
        }
        .chat-send-btn {
            background: var(--accent-gold);
            border: none;
            color: white;
            padding: 0 25px;
            border-radius: 30px;
            cursor: pointer;
            font-weight: 600;
        }

        /* Modal Nouveau Message */
        .modal-overlay {
            position: fixed; top:0; left:0; right:0; bottom:0;
            background: rgba(0,0,0,0.7);
            display: none; align-items:center; justify-content:center;
            z-index: 1000;
        }
        .modal {
            background: var(--bg-color);
            width: 400px;
            border-radius: 12px;
            padding: 20px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>
    <div class="layout-messages">
        <!-- Sidebar Gauche -->
        <div class="sidebar-left">
            <div class="logo">The <span>Hive.</span></div>
            <nav class="nav-menu">
                <a href="/home.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:15px;"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
                    Accueil
                </a>
                <a href="/explore.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:15px;"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    Explorer
                </a>
                <a href="#" id="my-profile-link" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:15px;"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path><circle cx="12" cy="7" r="4"></circle></svg>
                    Profil
                </a>
                <a href="/messages.html" class="nav-item active">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:15px;"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path></svg>
                    Messages
                </a>
                <a href="/settings.html" class="nav-item">
                    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="margin-right:15px;"><circle cx="12" cy="12" r="3"></circle><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path></svg>
                    Paramètres
                </a>
            </nav>
            <button class="btn-post" onclick="window.location.href='/home.html'">Publier</button>
        </div>

        <div class="messages-container">
            <!-- Panneau Contacts -->
            <div class="contacts-pane">
                <div class="contacts-header">
                    <span id="current-username">Messages</span>
                    <button id="btn-new-msg" style="background:none; border:none; cursor:pointer; color:var(--text-color);">
                        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"></path><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"></path></svg>
                    </button>
                </div>
                <div class="contacts-list" id="contacts-list">
                    <p style="text-align:center; color:#888; margin-top:20px;">Chargement...</p>
                </div>
            </div>

            <!-- Panneau Chat -->
            <div class="chat-pane" id="chat-pane" style="display:none;">
                <div class="chat-header">
                    <img id="chat-avatar" src="" style="width:40px; height:40px; border-radius:50%; object-fit:cover;">
                    <span id="chat-username" style="font-size:1.1rem;"></span>
                </div>
                <div class="chat-history" id="chat-history">
                    <!-- Bulles insérées ici -->
                </div>
                <div class="chat-input-area">
                    <input type="text" id="chat-input" class="chat-input" placeholder="Votre message...">
                    <button id="chat-send" class="chat-send-btn">Envoyer</button>
                </div>
            </div>

            <!-- Empty State -->
            <div class="chat-empty" id="chat-empty">
                <svg width="60" height="60" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" style="margin-bottom:20px; border:2px solid var(--text-color); border-radius:50%; padding:15px;"><path d="M22 2L11 13"></path><path d="M22 2L15 22L11 13L2 9L22 2z"></path></svg>
                <h2 style="margin-bottom:10px;">Vos messages</h2>
                <p style="color:var(--text-muted); margin-bottom:20px;">Envoyez des messages privés à un(e) ami(e).</p>
                <button class="btn-small" onclick="document.getElementById('modal-new').style.display='flex'">Envoyer un message</button>
            </div>
        </div>
    </div>

    <!-- Modal Nouveau Message -->
    <div class="modal-overlay" id="modal-new">
        <div class="modal">
            <h3 style="margin-bottom:20px; text-align:center;">Nouveau message</h3>
            <p style="margin-bottom:10px; font-size:0.9rem; color:var(--text-muted);">Entrez le pseudo exact de l'utilisateur :</p>
            <input type="text" id="new-msg-username" placeholder="@pseudo" style="width:100%; padding:10px; border-radius:8px; border:1px solid var(--border-color); background:transparent; color:white; margin-bottom:20px; box-sizing:border-box;">
            <div style="display:flex; gap:10px; justify-content:flex-end;">
                <button class="btn-small" style="background:transparent; border:1px solid var(--border-color);" onclick="document.getElementById('modal-new').style.display='none'">Annuler</button>
                <button class="btn-small" id="btn-start-chat">Discuter</button>
            </div>
        </div>
    </div>

    <script src="/js/sidebar.js"></script>
    <script src="/js/messages.js"></script>
</body>
</html>
